    <h2 class="sayfa-baslik">Tarihi Keşfet</h2>





   <form class="tarih-form">
    <div class="form-grup">
        <label for="tarih">Tarih seç:</label>
        <input
        type="number"
        id="tarih"
        placeholder="Örneğin 1923"
        min="0"
        max="2026"
        required>
    </div>
    <div class="form-grup">
        <label for="donem">Dönem:</label>

        <select id="donem">
            <option value="BCE">Milattan Önce</option>
            <option value="CE">Milattan Sonra</option>
        </select>
    </div>
    <button type="submit">Haritayı göster</button>
   </form>

    <p id="tarih-sonucu"></p>
    
    
    <div class="kutu">Dünya Haritası
        <img src="dunya-haritası.svg" alt="Dünya Haritası">
